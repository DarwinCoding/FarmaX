<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuarios — Farmacia Clínica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/auth.css"/>
  <script src="/js/auth-guard.js"></script>
</head>
<body>

  <header>
    <img src="/img/logo.svg" alt="Farmacia Clínica" class="header-logo"/>
    <div class="header-texto">
      <h1>Farmacia Clínica</h1>
      <p>Gestión de usuarios del sistema</p>
    </div>
  </header>

  <nav class="nav-principal">
    <div class="nav-enlaces">
      <a href="/" class="nav-link">💊 Inventario</a>
      <a href="/ordenes.html" class="nav-link">📦 Órdenes</a>
      <a href="/reportes.html" class="nav-link">📊 Reportes</a>
      <a href="/usuarios.html" class="nav-link activo" data-solo-admin>👥 Usuarios</a>
    </div>
    <div class="nav-usuario">
      <span id="nav-username">…</span>
      <span class="nav-badge-rol" id="nav-rol"></span>
      <button class="btn-logout" onclick="cerrarSesion()">⏻ Salir</button>
    </div>
  </nav>

  <main>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem">
        <h2 class="card-titulo" style="margin-bottom:0; border-bottom:none; padding-bottom:0">👥 Usuarios del Sistema</h2>
        <button class="btn btn-primario" onclick="abrirModalNuevoUsuario()">➕ Nuevo usuario</button>
      </div>

      <div class="tabla-contenedor">
        <table class="tabla-usuarios">
          <thead>
            <tr>
              <th>#</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios-body">
            <tr><td colspan="5" class="sin-datos">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>Farmacia Clínica v3.0 — Gestión de Usuarios</footer>

  <!-- ── Modal: crear / editar usuario ── -->
  <div id="modal-usuario-overlay" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(2px)">
    <div class="modal" style="max-width:420px; width:90%">
      <div class="modal-icono">👤</div>
      <h3 id="modal-usuario-titulo">Nuevo Usuario</h3>

      <div class="modal-form">
        <div class="form-grupo">
          <label for="u-username">Nombre de usuario</label>
          <input type="text" id="u-username" placeholder="Ej: farmaceutico1" autocomplete="off"/>
        </div>
        <div class="form-grupo">
          <label for="u-password">Contraseña <span id="u-password-hint" style="font-weight:400;text-transform:none;color:var(--gris-texto)">(dejar vacío para no cambiar)</span></label>
          <input type="password" id="u-password" placeholder="Mínimo 6 caracteres"/>
        </div>
        <div class="form-grupo">
          <label for="u-rol">Rol</label>
          <select id="u-rol">
            <option value="usuario">👤 Usuario — Solo órdenes y ver inventario</option>
            <option value="admin">👑 Admin — Acceso completo</option>
          </select>
        </div>
        <div id="u-error" style="display:none; color:var(--rojo); font-size:0.85rem; background:var(--rojo-suave); padding:0.5rem 0.75rem; border-radius:6px"></div>
      </div>

      <div class="modal-botones">
        <button class="btn btn-primario" id="btn-guardar-usuario" onclick="guardarUsuario()">💾 Guardar</button>
        <button class="btn btn-secundario" onclick="cerrarModalUsuario()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="toast-contenedor"></div>
  <script src="/js/usuarios.js"></script>
</body>
</html>

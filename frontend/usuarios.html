<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuarios — FarmaX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/auth.css"/>
  <script src="/js/auth-guard.js"></script>
</head>
<body data-permiso-pagina="ver_usuarios">

  <header>
    <img src="/img/LOGO FARMAX.png" alt="FarmaX" class="header-logo"/>
  </header>

  <nav class="nav-principal">
    <div class="nav-enlaces">
      <a href="/dashboard.html"      class="nav-link" data-permiso="ver_dashboard">Dashboard</a>
      <a href="/"                    class="nav-link" data-permiso="ver_inventario">Inventario</a>
      <a href="/ordenes.html"        class="nav-link" data-permiso="ver_ordenes">Ordenes</a>
      <a href="/reportes.html"       class="nav-link" data-permiso="ver_reportes">Reportes</a>
      <a href="/orden-especial.html" class="nav-link" data-permiso="ver_ordenes_especiales">Orden Especial</a>
      <a href="/configuracion.html"  class="nav-link" data-permiso="ver_configuracion">Configuracion</a>
      <a href="/auditoria.html"      class="nav-link" data-solo-admin>Auditoria</a>
      <a href="/usuarios.html"       class="nav-link activo" data-permiso="ver_usuarios">Usuarios</a>
    </div>
    <div class="nav-usuario">
      <span id="nav-username">…</span>
      <span class="nav-badge-rol" id="nav-rol"></span>
      <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
    </div>
  </nav>

  <main>
    <div class="card">
      <div class="card-cabecera">
        <h2 class="card-titulo">Usuarios del Sistema</h2>
        <button class="btn btn-primario" data-permiso="crear_usuarios" onclick="abrirModalNuevoUsuario()">Nuevo usuario</button>
      </div>

      <div class="tabla-contenedor">
        <table class="tabla-usuarios">
          <thead>
            <tr>
              <th>#</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios-body">
            <tr><td colspan="5" class="sin-datos">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>FarmaX v4.0 — Gestion de Usuarios</footer>

  <!-- Modal: crear / editar usuario -->
  <div id="modal-usuario-overlay" class="modal-overlay">
    <div class="modal modal-usuario">
      <h3 id="modal-usuario-titulo">Nuevo Usuario</h3>

      <div class="modal-form">
        <div class="form-grupo">
          <label for="u-username">Nombre de usuario</label>
          <input type="text" id="u-username" placeholder="Ej: farmaceutico1" autocomplete="off"/>
        </div>
        <div class="form-grupo">
          <label for="u-password">
            Contrasena
            <span id="u-password-hint" class="campo-opcional">(dejar vacio para no cambiar)</span>
          </label>
          <input type="password" id="u-password" placeholder="Minimo 6 caracteres"/>
        </div>
        <div class="form-grupo">
          <label for="u-rol">Rol</label>
          <select id="u-rol">
            <option value="usuario">Usuario — Solo ordenes y ver inventario</option>
            <option value="admin">Admin — Acceso completo</option>
          </select>
        </div>
        <div class="form-grupo">
          <label>Permisos</label>
          <div id="u-permisos-admin-aviso" class="permisos-admin-aviso">
            El administrador tiene todos los permisos automaticamente.
          </div>
          <div id="u-permisos-lista" class="permisos-lista"></div>
        </div>
        <div id="u-error" class="form-error"></div>
      </div>

      <div class="modal-botones">
        <button class="btn btn-primario" id="btn-guardar-usuario" onclick="guardarUsuario()">Guardar</button>
        <button class="btn btn-secundario" onclick="cerrarModalUsuario()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="toast-contenedor"></div>
  <script src="/js/usuarios.js"></script>
</body>
</html>

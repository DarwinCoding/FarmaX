<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesion — FarmaX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <!-- Un solo CSS: todos los estilos del login estan en style.css -->
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<!-- body.login-page activa el fondo degradado definido en style.css -->
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <img src="/img/LOGO FARMAX.png" alt="FarmaX" />
    </div>

    <h1 class="login-titulo">Bienvenido</h1>
    <p class="login-subtitulo">Ingresa tus credenciales para acceder al sistema</p>

    <div class="login-form">
      <div class="form-grupo">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Usuario" autocomplete="username" autofocus />
      </div>
      <div class="form-grupo">
        <label for="password">Contrasena</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="error-login">Usuario o contrasena incorrectos</div>

      <button class="btn-login" id="btn-login">Iniciar Sesion</button>
    </div>

    <p class="login-footer">FarmaX v4.0 — Acceso restringido</p>
  </div>

  <script>
    // Si ya hay sesion activa, ir directo al inventario
    fetch("/api/auth/me").then(r => {
      if (r.ok) window.location.href = "/dashboard.html";
    }).catch(() => {});

    const btnLogin = document.getElementById("btn-login");
    const errorDiv = document.getElementById("error-login");

    async function hacerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        errorDiv.textContent = "Ingresa usuario y contrasena";
        errorDiv.style.display = "block";
        return;
      }

      btnLogin.disabled    = true;
      btnLogin.textContent = "Verificando...";
      errorDiv.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          window.location.href = "/dashboard.html";
        } else {
          const data = await res.json();
          errorDiv.textContent = data.error || "Error al iniciar sesion";
          errorDiv.style.display = "block";
          btnLogin.disabled    = false;
          btnLogin.textContent = "Iniciar Sesion";
        }
      } catch (err) {
        errorDiv.textContent = "No se pudo conectar con el servidor";
        errorDiv.style.display = "block";
        btnLogin.disabled    = false;
        btnLogin.textContent = "Iniciar Sesion";
      }
    }

    btnLogin.addEventListener("click", hacerLogin);
    document.addEventListener("keydown", e => { if (e.key === "Enter") hacerLogin(); });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión — Farmacia Clínica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* ── Estilos exclusivos de la página de login ── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(145deg, #0a4a3a 0%, #1a9070 60%, #e8f5f1 100%);
    }

    .login-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(10, 74, 58, 0.3);
      text-align: center;
    }

    .login-logo {
      margin-bottom: 0.4rem;
    }

    .login-logo img {
      width: auto;
      height: 90px;
    }

    .login-titulo {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.4rem;
      color: var(--verde-oscuro);
      margin-bottom: 0.3rem;
    }

    .login-subtitulo {
      font-size: 0.83rem;
      color: var(--gris-texto);
      margin-bottom: 1.8rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .login-form .form-grupo label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--verde-oscuro);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }

    .login-form input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--gris-borde);
      border-radius: 8px;
      font-family: var(--fuente-cuerpo);
      font-size: 0.95rem;
      background: var(--gris-claro);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-form input:focus {
      border-color: var(--verde-claro);
      box-shadow: 0 0 0 3px rgba(26, 144, 112, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 0.8rem;
      background: var(--verde-oscuro);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--fuente-cuerpo);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.18s, box-shadow 0.18s;
    }

    .btn-login:hover {
      background: var(--verde-claro);
      box-shadow: 0 4px 16px rgba(10, 74, 58, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error-login {
      display: none;
      background: var(--rojo-suave);
      color: var(--rojo);
      border: 1px solid var(--rojo-borde);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.88rem;
      text-align: center;
      margin-top: 0.5rem;
    }

    .login-footer {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--gris-texto);
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="img/Logo.png" alt="Farmacia Clínica" />
    </div>

    <h1 class="login-titulo">Bienvenido</h1>
    <p class="login-subtitulo">Ingresa tus credenciales para acceder al sistema</p>

    <div class="login-form">
      <div class="form-grupo">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          placeholder="Usuario"
          autocomplete="username"
          autofocus
        />
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <div id="error-login">❌ Usuario o contraseña incorrectos</div>

      <button class="btn-login" id="btn-login">
        🔐 Iniciar Sesión
      </button>
    </div>

    <p class="login-footer">Farmacia Clínica v3.0 — Acceso restringido</p>
  </div>

  <script>
    // ── Verificar si ya hay sesión activa ──
    // Si el usuario ya está logueado, lo mandamos directo al inventario
    fetch("/api/auth/me").then(r => {
      if (r.ok) window.location.href = "/";
    }).catch(() => {});

    // ── Manejar el formulario de login ──
    const btnLogin  = document.getElementById("btn-login");
    const errorDiv  = document.getElementById("error-login");

    async function hacerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        errorDiv.textContent = "⚠ Ingresa usuario y contraseña";
        errorDiv.style.display = "block";
        return;
      }

      btnLogin.disabled    = true;
      btnLogin.textContent = "⏳ Verificando…";
      errorDiv.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          // Login correcto: redirigir al inventario
          window.location.href = "/";
        } else {
          const data = await res.json();
          errorDiv.textContent = "❌ " + (data.error || "Error al iniciar sesión");
          errorDiv.style.display = "block";
          btnLogin.disabled    = false;
          btnLogin.textContent = "🔐 Iniciar Sesión";
        }
      } catch (err) {
        errorDiv.textContent = "❌ No se pudo conectar con el servidor";
        errorDiv.style.display = "block";
        btnLogin.disabled    = false;
        btnLogin.textContent = "🔐 Iniciar Sesión";
      }
    }

    btnLogin.addEventListener("click", hacerLogin);

    // Permitir Enter para hacer login
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") hacerLogin();
    });
  </script>

</body>
</html>

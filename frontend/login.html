<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión — Farmacia Clínica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
  /* ─────────────────────────────────────
     LOGIN MODERNO — FARMAX / MEDISTOCK
  ───────────────────────────────────── */

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;

    font-family: 'DM Sans', sans-serif;

    background:
      radial-gradient(circle at top left, #DFF4FF 0%, transparent 30%),
      radial-gradient(circle at bottom right, #EEE5FF 0%, transparent 30%),
      linear-gradient(135deg, #F8FBFF 0%, #EEF6FF 100%);
  }

  .login-card {
  background: rgba(255,255,255,0.92);

  backdrop-filter: blur(10px);

  border: 1px solid #E3EEF6;

  border-radius: 24px;

  padding: 2rem 1.8rem;

  width: 100%;
  max-width: 360px;

  box-shadow:
    0 15px 45px rgba(47,128,237,0.10),
    0 6px 18px rgba(124,92,255,0.08);

  text-align: center;
}

  .login-logo {
    margin-bottom: 0.8rem;
  }

  .login-logo img {
  width: auto;
  height: 120px;
}

  .login-titulo {
    font-family: 'DM Serif Display', Georgia, serif;

    font-size: 1.6rem;

    color: #1F2937;

    margin-bottom: 0.4rem;
  }

  .login-subtitulo {
    font-size: 0.88rem;

    color: #6B7280;

    margin-bottom: 2rem;
  }

  .login-form {
    display: flex;

    flex-direction: column;

    gap: 1rem;

    text-align: left;
  }

  .login-form .form-grupo label {
    display: block;

    font-size: 0.82rem;

    font-weight: 700;

    color: #4F46E5;

    text-transform: uppercase;

    letter-spacing: 0.05em;

    margin-bottom: 0.45rem;
  }

  .login-form input {
    width: 100%;

    padding: 0.75rem 1rem;

    border: 1.5px solid #DCEBFA;

    border-radius: 14px;

    font-family: 'DM Sans', sans-serif;

    font-size: 0.96rem;

    background: #F8FBFF;

    outline: none;

    transition:
      border-color 0.25s,
      box-shadow 0.25s,
      transform 0.15s;
  }

  .login-form input:focus {
    border-color: #4FC3F7;

    box-shadow:
      0 0 0 4px rgba(79,195,247,0.15);

    background: white;

    transform: translateY(-1px);
  }

  .btn-login {
    width: 100%;

    padding: 0.8rem;

    background: linear-gradient(
      135deg,
      #4FC3F7 0%,
      #7C5CFF 100%
    );

    color: white;

    border: none;

    border-radius: 14px;

    font-family: 'DM Sans', sans-serif;

    font-size: 1rem;

    font-weight: 700;

    cursor: pointer;

    margin-top: 0.7rem;

    transition:
      transform 0.18s,
      box-shadow 0.18s;
  }

  .btn-login:hover {
    transform: translateY(-2px);

    box-shadow:
      0 12px 28px rgba(79,195,247,0.28);
  }

  .btn-login:disabled {
    opacity: 0.6;

    cursor: not-allowed;
  }

  #error-login {
    display: none;

    background: #FDECEC;

    color: #E74C3C;

    border: 1px solid #F5B7B1;

    border-radius: 12px;

    padding: 0.8rem 1rem;

    font-size: 0.88rem;

    text-align: center;

    margin-top: 0.7rem;
  }

  .login-footer {
    margin-top: 1.8rem;

    font-size: 0.8rem;

    color: #6B7280;
  }
</style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="img/LOGO FARMAX.png" alt="Farmacia Clínica" />
    </div>

    <h1 class="login-titulo">Bienvenido</h1>
    <p class="login-subtitulo">Ingresa tus credenciales para acceder al sistema</p>

    <div class="login-form">
      <div class="form-grupo">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          placeholder="Usuario"
          autocomplete="username"
          autofocus
        />
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <div id="error-login">❌ Usuario o contraseña incorrectos</div>

      <button class="btn-login" id="btn-login">
        🔐 Iniciar Sesión
      </button>
    </div>

    <p class="login-footer">FarmaX v1.0 - Acceso restringido</p>
  </div>

  <script>
    // ── Verificar si ya hay sesión activa ──
    // Si el usuario ya está logueado, lo mandamos directo al inventario
    fetch("/api/auth/me").then(r => {
      if (r.ok) window.location.href = "/";
    }).catch(() => {});

    // ── Manejar el formulario de login ──
    const btnLogin  = document.getElementById("btn-login");
    const errorDiv  = document.getElementById("error-login");

    async function hacerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        errorDiv.textContent = "⚠ Ingresa usuario y contraseña";
        errorDiv.style.display = "block";
        return;
      }

      btnLogin.disabled    = true;
      btnLogin.textContent = "⏳ Verificando…";
      errorDiv.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          // Login correcto: redirigir al inventario
          window.location.href = "/";
        } else {
          const data = await res.json();
          errorDiv.textContent = "❌ " + (data.error || "Error al iniciar sesión");
          errorDiv.style.display = "block";
          btnLogin.disabled    = false;
          btnLogin.textContent = "🔐 Iniciar Sesión";
        }
      } catch (err) {
        errorDiv.textContent = "❌ No se pudo conectar con el servidor";
        errorDiv.style.display = "block";
        btnLogin.disabled    = false;
        btnLogin.textContent = "🔐 Iniciar Sesión";
      }
    }

    btnLogin.addEventListener("click", hacerLogin);

    // Permitir Enter para hacer login
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") hacerLogin();
    });
  </script>

</body>
</html>

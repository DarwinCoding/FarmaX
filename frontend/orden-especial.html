<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orden Especial — FarmaX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/auth.css"/>
  <script src="/js/auth-guard.js"></script>
</head>
<body>

  <header>
    <img src="/img/LOGO FARMAX.png" alt="FarmaX" class="header-logo"/>
  </header>

  <nav class="nav-principal">
    <div class="nav-enlaces">
      <a href="/dashboard.html"      class="nav-link">Dashboard</a>
      <a href="/"                    class="nav-link">Inventario</a>
      <a href="/ordenes.html"        class="nav-link">Ordenes</a>
      <a href="/reportes.html"       class="nav-link">Reportes</a>
      <a href="/orden-especial.html" class="nav-link activo">Orden Especial</a>
      <a href="/usuarios.html"       class="nav-link" data-solo-admin>Usuarios</a>
    </div>
    <div class="nav-usuario">
      <span id="nav-username">…</span>
      <span class="nav-badge-rol" id="nav-rol"></span>
      <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
    </div>
  </nav>

  <main>
    <!-- Formulario de registro -->
    <div class="card">
      <h2 class="card-titulo">Registrar Orden Especial</h2>
      <p class="card-descripcion">
        Registra entregas de medicamentos a medicos o personal. El stock se descuenta automaticamente.
      </p>

      <div class="form-grid">

        <div class="form-grupo">
          <label for="oe-nombre">Nombre del medico / personal <span class="requerido">*</span></label>
          <input type="text" id="oe-nombre" placeholder="Ej: Dr. Garcia Lopez" autocomplete="off"/>
        </div>

        <div class="form-grupo">
          <label for="oe-tipo">Tipo de persona <span class="requerido">*</span></label>
          <select id="oe-tipo">
            <option value="">- Seleccionar -</option>
            <option value="médico">Medico</option>
            <option value="personal">Personal</option>
          </select>
        </div>

        <!-- Buscador de medicamento con autocompletado -->
        <div class="form-grupo oe-autocomplete-wrapper">
          <label for="oe-med-busqueda">Medicamento <span class="requerido">*</span></label>
          <input
            type="text"
            id="oe-med-busqueda"
            placeholder="Escriba para buscar..."
            autocomplete="off"
            oninput="buscarMedicamento(this.value)"
            onfocus="buscarMedicamento(this.value)"
          />
          <!-- Sugerencias del autocompletado — posicionadas por CSS -->
          <div id="oe-autocomplete"></div>
          <input type="hidden" id="oe-medicamento-id"/>
          <small id="oe-stock-info" class="campo-ayuda"></small>
        </div>

        <div class="form-grupo">
          <label for="oe-cantidad">Cantidad <span class="requerido">*</span></label>
          <input type="number" id="oe-cantidad" min="1" placeholder="Ej: 5"/>
        </div>

        <div class="form-grupo">
          <label for="oe-fecha">Fecha <span class="requerido">*</span></label>
          <input type="date" id="oe-fecha"/>
        </div>

        <div class="form-grupo form-grupo-full">
          <label for="oe-observacion">Observacion <span class="campo-opcional">(opcional)</span></label>
          <input type="text" id="oe-observacion" placeholder="Ej: para uso en sala 3"/>
        </div>

      </div>

      <div class="form-acciones">
        <button class="btn btn-primario" onclick="registrarOrden()">Registrar orden especial</button>
        <button class="btn btn-secundario" onclick="limpiarFormulario()">Limpiar</button>
      </div>
    </div>

    <!-- Historial -->
    <div class="card">
      <div class="card-cabecera">
        <h2 class="card-titulo">Historial de ordenes especiales</h2>
        <button class="btn btn-secundario" onclick="cargarHistorial()">Actualizar</button>
      </div>
      <div id="tabla-ordenes-especiales">
        <p style="color:var(--gris-texto)">Cargando...</p>
      </div>
    </div>
  </main>

  <footer>FarmaX v4.0 — Modulo de Ordenes Especiales</footer>
  <div id="toast-contenedor"></div>
  <script src="/js/orden-especial.js"></script>
</body>
</html>
